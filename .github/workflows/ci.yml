name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -p drift-core -p drift-geom -p drift-io -p drift-platform -p drift-solver -p drift-render -p drift-app -p drift-web
      - name: Clippy (wasm32, the browser demo)
        run: cargo clippy --target wasm32-unknown-unknown -p drift-web --features demo

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan (lavapipe) for GPU render tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace
      # The browser demo: saving, exporting and printing show a note, and copies stay inside.
      - run: cargo test -p drift-app --features demo --test demo
      - name: Upload render test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-tests-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # THIRD-PARTY-NOTICES.txt must match Cargo.lock: run `python scripts/notices.py` after
      # changing dependencies, and commit the result.
      - run: python3 scripts/notices.py --check

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        working-directory: apps/web
        run: >
          trunk build --release --cargo-profile web-release
          --public-url "/${{ github.event.repository.name }}/"
      # The demo the website serves at /app/ (website.yml builds and deploys it).
      - name: Build the demo
        working-directory: apps/web
        run: >
          trunk build --release --cargo-profile web-release --features demo
          --public-url /app/ --dist dist-demo
      - name: Check bundle size (budget 6 MB gzipped)
        run: |
          for dist in dist dist-demo; do
            size=$(gzip -9 -c apps/web/$dist/*.wasm | wc -c)
            echo "WASM gzipped ($dist): $((size / 1024)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$size" -lt $((6 * 1024 * 1024))
          done
      - name: The demo has no way to download a file
        run: scripts/check-demo-build.sh apps/web/dist-demo apps/web/dist
      # Once the website is live (the SITE_URL repository variable is set, e.g.
      # https://drift.example), GitHub Pages only redirects to its /app/; until then it
      # serves the app itself. The website workflow builds and deploys the site.
      - name: Redirect page for GitHub Pages
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          mkdir -p pages-redirect
          sed "s#SITE_URL#${SITE_URL%/}#g" website/github-pages-redirect.html > pages-redirect/index.html
          cp pages-redirect/index.html pages-redirect/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.SITE_URL != '' && 'pages-redirect' || 'apps/web/dist' }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
