name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -p drift-core -p drift-geom -p drift-io -p drift-platform -p drift-solver -p drift-render -p drift-app -p drift-web

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan (lavapipe) for GPU render tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace
      - name: Upload render test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-tests-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore

  blender:
    name: Blender add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Profiles file to splines (no Blender)
        run: python -m unittest discover -s integrations/blender/tests -p "test_*.py" -v
      - name: The manifest's version is Drift's
        run: python scripts/package-blender-addon.py --check

  # The add-on in a real Blender (the oldest it supports), headless. It downloads Blender, so
  # it is optional: a failure to fetch it doesn't fail the build.
  blender-headless:
    name: Blender add-on (headless Blender 4.2)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Blender 4.2 LTS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libxxf86vm1 libxfixes3
          curl -sSfL https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
      - name: Import, sweep, lathe and reload
        run: >
          "$RUNNER_TEMP/blender-4.2.0-linux-x64/blender" --background --factory-startup
          --python-exit-code 1 --python integrations/blender/tests/blender_headless.py

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # THIRD-PARTY-NOTICES.txt must match Cargo.lock: run `python scripts/notices.py` after
      # changing dependencies, and commit the result.
      - run: python3 scripts/notices.py --check

  # The browser build, checked on every change though only the website serves it (at /app/,
  # built by the Website workflow).
  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        working-directory: apps/web
        run: trunk build --release --cargo-profile web-release --public-url /app/
      - name: Check bundle size (budget 6 MB gzipped)
        run: |
          size=$(gzip -9 -c apps/web/dist/*.wasm | wc -c)
          echo "WASM gzipped: $((size / 1024)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -lt $((6 * 1024 * 1024))
