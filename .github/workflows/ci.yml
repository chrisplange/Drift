name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Merges made by the auto-merge job's token don't fire `push`; it dispatches this workflow
  # on main instead, and the nightly run catches anything a dispatch missed.
  schedule:
    - cron: "41 5 * * *"

# A pull request's newer push cancels its older run. On main every commit gets its own
# group, so no run there is cancelled or dropped while queued, and a red main names the
# merge that broke it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: Rust 1.100's clippy flags two loops in drift-solver (2026-11-12). Unpin once
      # they're fixed in a normal solver PR. Tests still build on stable.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      # One crate at a time: built together, the crates' features unify (drift-app turns on
      # drift-io's `dwg`), which hides warnings a crate gives with its own defaults (#320).
      - name: Clippy (wasm32)
        run: |
          for crate in drift-core drift-geom drift-io drift-platform drift-solver drift-render drift-edit drift-app drift-web; do
            cargo clippy --target wasm32-unknown-unknown -p "$crate"
          done
      - name: Clippy (wasm32, the browser demo)
        run: cargo clippy --target wasm32-unknown-unknown -p drift-web --features demo

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The UI and smoke tests fail without a graphics adapter instead of skipping. Each test
      # log says which adapter they rendered on: lavapipe on Linux, WARP on Windows, Metal on
      # macOS.
      DRIFT_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install software Vulkan (lavapipe) for GPU render tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo test --workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace
      # Windows: the same tests, with one retry for drift-app's alone. Its test binary sometimes
      # dies mid UI tests under the WARP software renderer, at a different test each time
      # (#353), so no single test can be quarantined. Every other crate gets no retry.
      - name: cargo test --workspace (Windows, drift-app retried once for #353)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --workspace --exclude drift-app
          cargo test -p drift-app && exit 0
          echo "::warning::drift-app tests failed on Windows; retrying once (#353)"
          cargo test -p drift-app
      # The editor, edits and tools without a window (no GPU; also part of the line above).
      - run: cargo test -p drift-edit
      # The browser demo: saving, exporting and printing show a note, and copies stay inside.
      - run: cargo test -p drift-app --features demo --test demo
      - name: Upload render test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-tests-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore

  blender:
    name: Blender add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Profiles file to splines (no Blender)
        run: python -m unittest discover -s integrations/blender/tests -p "test_*.py" -v
      - name: The manifest's version is Drift's
        run: python scripts/package-blender-addon.py --check

  # The merge-gate scripts: tiers, the Solver review status and the auto-merge rules.
  gates:
    name: Merge-gate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v

  # The add-on in a real Blender (the oldest it supports), headless. It downloads Blender, so
  # it is optional: a failure to fetch it doesn't fail the build.
  blender-headless:
    name: Blender add-on (headless Blender 4.2)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Blender 4.2 LTS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libxxf86vm1 libxfixes3
          curl -sSfL https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
      - name: Import, sweep, lathe and reload
        run: >
          "$RUNNER_TEMP/blender-4.2.0-linux-x64/blender" --background --factory-startup
          --python-exit-code 1 --python integrations/blender/tests/blender_headless.py

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # THIRD-PARTY-NOTICES.txt must match Cargo.lock: run `python scripts/notices.py` after
      # changing dependencies, and commit the result.
      - run: python3 scripts/notices.py --check

  # The browser builds: the full app, and the demo the website serves at /app/ (built and
  # deployed by the Website workflow).
  # Paused 2026-10-28: the wasm clippies (lint) and the demo test (test) still run on every
  # change, and the Website workflow still builds the demo. Remove `if: false` to turn it back on.
  web:
    name: Web build
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build
        working-directory: apps/web
        run: trunk build --release --cargo-profile web-release --public-url /app/
      # The demo the website serves at /app/ (website.yml builds and deploys it).
      - name: Build the demo
        working-directory: apps/web
        run: >
          trunk build --release --cargo-profile web-release --features demo
          --public-url /app/ --dist dist-demo
      - name: Check bundle size (budget 6 MB gzipped)
        run: |
          for dist in dist dist-demo; do
            size=$(gzip -9 -c apps/web/$dist/*.wasm | wc -c)
            echo "WASM gzipped ($dist): $((size / 1024)) KiB" | tee -a "$GITHUB_STEP_SUMMARY"
            test "$size" -lt $((6 * 1024 * 1024))
          done
      - name: The demo has no way to download a file
        run: scripts/check-demo-build.sh apps/web/dist-demo apps/web/dist
