name: Package

# Builds the downloads: the Windows installer and zip, and the universal macOS disk image.
# Run it by hand from the Actions tab, or push a tag like v0.1.0-alpha.5.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: drift-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drift-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    # Only for a version tag: the files go on a draft release, to look over and publish.
    # Drafts are invisible to Drift's updater: it offers a release once it is published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is the version in Cargo.toml
        run: |
          version=$(awk '/^\[workspace\.package\]/{p=1} p && /^version/{gsub(/[" ]/,"",$0); sub(/version=/,""); print; exit}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml's version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Drift-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Drift's updater installs a release only if this signature checks out with the public
      # key built into the app (crates/drift-app/src/update/release-key.pub). See
      # docs/releasing.md for making the key and the MINISIGN_SECRET_KEY secret.
      - name: Sign the checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the MINISIGN_SECRET_KEY secret is missing: see docs/releasing.md" >&2
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          key="$RUNNER_TEMP/release.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m SHA256SUMS.txt -t "Drift ${GITHUB_REF_NAME#v}" < /dev/null
          rm -f "$key"
          # The app checks with the key it was built with: refuse a release it would refuse.
          minisign -V -p ../crates/drift-app/src/update/release-key.pub -m SHA256SUMS.txt
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Drift-* dist/SHA256SUMS.txt dist/SHA256SUMS.txt.minisig \
            --draft --prerelease --title "Drift ${GITHUB_REF_NAME#v}" --generate-notes
