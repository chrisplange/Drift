name: Package

# Builds the downloads: the Windows installer and zip, the universal macOS disk image, and
# the Drift profiles add-on for Blender. The Windows and macOS downloads hold drift-mcp too,
# the MCP server for AI assistants (the scripts build it).
# Run it by hand from the Actions tab, or push a tag like v0.1.0-beta.1.5.
#
# Releases are published from the public releases repository, not this one: it holds the
# downloads, the release notes and the public issues, and no source. See docs/releasing.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Where releases are published. Keep in step with RELEASES_URL in
  # crates/drift-app/src/update/mod.rs and `repo` in website/src/site.config.mjs.
  RELEASES_REPO: chrisplange/drift-releases

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package
        shell: pwsh
        run: scripts\package-windows.ps1 -Release
      - uses: actions/upload-artifact@v4
        with:
          name: drift-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drift-macos
          path: dist/*.dmg
          if-no-files-found: error

  blender:
    name: Blender add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: python3 scripts/package-blender-addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: drift-blender-addon
          path: dist/drift_profiles-*.zip
          if-no-files-found: error

  release:
    name: Draft release
    # Only for a version tag: the files go on a draft release, to look over and publish.
    # Drafts are invisible to Drift's updater: it offers a release once it is published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, blender]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its tags, to find the previous release for the notes.
          fetch-depth: 0
      - name: Check the tag is the version in Cargo.toml
        run: |
          version=$(awk '/^\[workspace\.package\]/{p=1} p && /^version/{gsub(/[" ]/,"",$0); sub(/version=/,""); print; exit}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml's version $version" >&2
            exit 1
          fi
      # The installer shows LICENSE.md for the user to accept: never ship one still marked as
      # a draft for legal review.
      - name: Check the licence agreement is final
        run: |
          if grep -qw DRAFT LICENSE.md; then
            echo "LICENSE.md is still marked DRAFT: finish its legal review before releasing" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Drift-* drift_profiles-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Drift's updater installs a release only if this signature checks out with the public
      # key built into the app (crates/drift-app/src/update/release-key.pub). See
      # docs/releasing.md for making the key and the MINISIGN_SECRET_KEY secret.
      - name: Sign the checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "the MINISIGN_SECRET_KEY secret is missing: see docs/releasing.md" >&2
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          key="$RUNNER_TEMP/release.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m SHA256SUMS.txt -t "Drift ${GITHUB_REF_NAME#v}" < /dev/null
          rm -f "$key"
          # The app checks with the key it was built with: refuse a release it would refuse.
          minisign -V -p ../crates/drift-app/src/update/release-key.pub -m SHA256SUMS.txt
      # The notes list the pull requests since the previous release by title only: links into
      # this repository would lead nowhere for the public, and "#97" would link to the releases
      # repository's own issue 97. Edit them before publishing.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" ${previous:+-f previous_tag_name="$previous"} \
            --jq .body \
            | sed -E -e 's/ by @[^ ]+ in https:[^ ]+$//' -e 's/ \(#[0-9]+[^)]*\)//g' \
              -e '/^\*\*Full Changelog\*\*/d' -e '/^## New Contributors/,$d' \
            > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "the RELEASES_TOKEN secret is missing: see docs/releasing.md" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --target main \
            dist/Drift-* dist/drift_profiles-* dist/SHA256SUMS.txt dist/SHA256SUMS.txt.minisig \
            --draft --prerelease --title "Drift ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
      # Copies of Drift up to Beta 1.4 look for updates in this repository. While it is still
      # public, the release goes here too, so they find the version that looks in the new place.
      - name: Draft the release here too, for copies that still look here
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Drift-* dist/drift_profiles-* dist/SHA256SUMS.txt dist/SHA256SUMS.txt.minisig \
            --draft --prerelease --title "Drift ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
