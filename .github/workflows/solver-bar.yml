name: Solver bar

# The solver's acceptance bar on Linux (docs/solver-audit.md, section 5, item 6, and decision
# 9): the heavy drag matrix and the ignored pins on ubuntu, where libm's sin, cos and atan2
# differ from Windows' and macOS' by the ulps that decide a drag at a fold. Nightly, by hand,
# and on any pull request that touches the solver, what it is built on, the editor that calls
# it, or this bar: the [heavy] and [solver] paths in .github/tiers.txt.
#
# It starts on every pull request so that its heavy job can be a required check: a PR that
# touches none of those paths skips the job, and a skipped job counts as passing. If the path
# check itself fails, the matrix runs anyway.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Does this need the heavy matrix
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.paths.outputs.heavy }}
    steps:
      # The default branch's rules and script judge the PR, not the PR's own.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Bootstrap (only until the gate scripts are on main)
        run: |
          if [ ! -f scripts/tier.py ]; then
            git fetch -q --depth=1 origin "$GITHUB_SHA"
            git checkout FETCH_HEAD -- scripts .github/tiers.txt
          fi
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/tier.py --pr "$PR" --explain --github-output
          fi

  heavy:
    name: Heavy drag matrix and pins (ubuntu)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true')
    # (Pinned, so a nightly that turns red names a change in the code, not in the runner's
    # libm; the summary prints glibc's and rustc's versions.)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versions
        run: |
          {
            echo "### Toolchain"
            echo
            echo "- $(rustc -V)"
            echo "- $(ldd --version | sed -n 1p)"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # 14 properties x seeds 1-20, release, --exact. Fails on a failure scripts/solver-bar/
      # expected.txt doesn't list for Linux, and on a listed one that passes; the table goes
      # to the job summary.
      - name: Heavy matrix
        run: python3 scripts/solver-bar/heavy.py --jobs 4 --out target/solver-bar/heavy
      # The ignored pins (#280's), reported, not judged: each solver PR names the pins it
      # un-ignores, and a pin that changes on Linux alone shows here. Fails only if the pins
      # didn't run (fewer than the `#[ignore = "#280...` pins seeds.rs has).
      - name: Pins
        if: always()
        run: |
          mkdir -p target/solver-bar
          cargo test --release -p drift-edit --lib drag_props::seeds:: -- --ignored --test-threads=4 \
            > target/solver-bar/pins.txt 2>&1 || true
          grep -E '^test .* \.\.\. (ok|FAILED)$' target/solver-bar/pins.txt > target/solver-bar/pins-lines.txt || true
          {
            echo "### Ignored pins (Linux)"
            echo
            sed -E 's/^test drag_props::seeds::(.*) \.\.\. (.*)$/- `\1`: \2/' target/solver-bar/pins-lines.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ran=$(wc -l < target/solver-bar/pins-lines.txt)
          # (`grep -c` exits 1 on no match: with every pin un-ignored there are none.)
          pins=$(grep -c '#\[ignore = "#280' crates/drift-edit/src/drag_props/seeds.rs || true)
          if [ "$ran" -lt "$pins" ]; then
            echo "::error::only $ran of the $pins pins ran"
            tail -50 target/solver-bar/pins.txt
            exit 1
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-bar-linux
          path: target/solver-bar/
          if-no-files-found: ignore
