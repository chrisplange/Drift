name: Website

# Builds the website (website/, with the user guide from docs/guide and the web app at /app/)
# and deploys it to Cloudflare Pages. It runs on merges to main that change what the site is
# built from: the site, the guide, the web app and every crate it builds in, the workspace
# files, and LICENSE.md and THIRD-PARTY-NOTICES.txt, which the licence pages read. Add a path
# here when the site or the web app starts reading something new. Releases are published in
# the public releases repository, where this workflow can't hear them, so the release steps in
# docs/releasing.md run it by hand afterwards (`gh workflow run website.yml`) for the download
# links and release notes to catch up. Pull requests that touch the site only build it. See
# website/README.md for the one-time Cloudflare setup.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/guide/**"
      - "apps/web/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE.md"
      - "THIRD-PARTY-NOTICES.txt"
      - "scripts/check-demo-build.sh"
      - ".github/workflows/website.yml"
  release:
    types: [published]
  pull_request:
    paths:
      - "website/**"
      - "docs/guide/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
  # The Cloudflare Pages project. Cloudflare picks its *.pages.dev address (adding a suffix if
  # the name is taken); put the real address in the SITE_URL repository variable.
  PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'drift-website' }}

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event points at its tag; the site is always built from main.
          ref: ${{ github.event_name == 'release' && 'main' || '' }}

      # The web app, served at /app/: the demo, which can't save, export or print (the code
      # isn't built in), with the download page as SITE_URL/download/.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build the web app
        working-directory: apps/web
        run: >
          trunk build --release --cargo-profile web-release --features demo
          --public-url /app/ --dist ../../website/public/app
        env:
          DRIFT_SITE_URL: ${{ vars.SITE_URL }}
      - name: Check the web app is the demo
        run: scripts/check-demo-build.sh website/public/app

      # The site.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - name: Build the site
        working-directory: website
        run: npm run build
        env:
          # Read the releases without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The site's public address, for canonical links and share tags (see website/README.md).
          SITE_URL: ${{ vars.SITE_URL }}

      # Deploys only from main (or a release), and only once the Cloudflare secrets exist.
      - name: Create the Cloudflare Pages project (first run only)
        if: >
          env.HAS_CLOUDFLARE == 'true' &&
          (github.event_name == 'release' || github.ref == 'refs/heads/main')
        continue-on-error: true # it fails harmlessly once the project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main
      - name: Deploy to Cloudflare Pages
        if: >
          env.HAS_CLOUDFLARE == 'true' &&
          (github.event_name == 'release' || github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=${{ env.PROJECT }} --branch=main
