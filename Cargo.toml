[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0-alpha.7"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/chrisplange/Drift"
# Not published to crates.io: the crates are parts of one application.
publish = false
rust-version = "1.92"

[workspace.dependencies]
drift-core = { path = "crates/drift-core" }
drift-draft = { path = "crates/drift-draft" }
drift-render = { path = "crates/drift-render" }
drift-app = { path = "crates/drift-app" }
drift-geom = { path = "crates/drift-geom" }
drift-io = { path = "crates/drift-io" }
drift-platform = { path = "crates/drift-platform" }
drift-solver = { path = "crates/drift-solver" }

bytemuck = { version = "1.23", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "persistence", "links"] }
glam = "0.34.1"
log = "0.4"
lyon_tessellation = "1"
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"

# Size-optimised profile for the WASM build (`trunk build --cargo-profile web-release`).
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# The solver's numeric loops are hot and small: optimise them for speed even in the size-tuned
# web build. Costs little download size.
[profile.web-release.package.drift-solver]
opt-level = 3
