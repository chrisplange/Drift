# cargo-about configuration: https://embarkstudios.github.io/cargo-about/
# scripts/notices.py runs it to write THIRD-PARTY-NOTICES.txt, the licences and copyright
# notices of everything built into Drift. See docs/releasing.md.

# Every platform Drift ships for, so the notices cover each build's dependencies.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]
# Only what ends up in the programs: not build scripts, tests or Drift's own crates.
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
# The licences a dependency may have; deny.toml checks the same list.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-root-certs only: cargo-about merges the targets, but no Drift build has it, so
    # scripts/notices.py leaves it out (see deny.toml).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# acadrust only (DWG import): MPL-2.0 is allowed for it alone, as in deny.toml.
[acadrust]
accepted = ["MPL-2.0"]
