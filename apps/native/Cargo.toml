[package]
name = "drift"
description = "Drift: parametric 2D sketching (desktop)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
drift-app.workspace = true
eframe.workspace = true
# Without its default `regex` feature: `RUST_LOG=drift=debug` still filters by module; only
# `/pattern` filters go, and the regex crates with them.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

# Files opened from Finder arrive as an Apple event (see src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
