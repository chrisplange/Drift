<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>Drift</title>
    <link data-trunk rel="rust" data-bin="drift-web" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="../../THIRD-PARTY-NOTICES.txt" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1d21;
        color: #e6e8eb;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #fbfbfa;
          color: #1d2126;
        }
      }
      #drift_canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-align: center;
        padding: 16px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="drift_canvas"></canvas>
    <div id="loading">Loading Drift…</div>
  </body>
</html>
