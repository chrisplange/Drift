[package]
name = "drift-app"
description = "Drift application shell: UI, tools and canvas interaction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
drift-core.workspace = true
drift-draft.workspace = true
drift-geom.workspace = true
drift-io.workspace = true
drift-platform.workspace = true
drift-render.workspace = true
drift-solver.workspace = true
eframe.workspace = true
glam.workspace = true
log.workspace = true
lyon_tessellation.workspace = true
web-time = "1"
# The assistant tools (`agent`): JSON arguments and results, and renders of the drawing as PNG
# pictures, made on the CPU.
serde_json = "1.0"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }

# The updater (native only): GitHub's releases API over HTTPS, checked with the operating
# system's certificates, and the download verified against a minisign signature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minisign-verify = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[features]
default = ["dwg"]
# Reading DWG drawings (File > Import, Import underlay).
dwg = ["drift-io/dwg"]
# The browser demo: everything but saving, exporting and printing, whose code (and the file
# writers in drift-io and drift-platform) is left out of the build. The menu items stay and
# say where to download Drift. Copies stay inside the app, and the session isn't kept.
demo = ["drift-io/demo", "drift-platform/demo"]

[lints]
workspace = true

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu", "snapshot"] }
pollster = "1.0"
proptest = "1"

# Signs test releases so the updater's verification can be checked (and makes the release
# signing key: `cargo run -p drift-app --example update_key`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
minisign = { version = "0.10", default-features = false }
