[package]
name = "drift-platform"
description = "Platform services for Drift: file dialogs and file I/O on native and web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"
memory-stats = "1.2"
fontdb = "0.24.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "EventTarget", "File", "FileList", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "Url", "Window"] }

[lints]
workspace = true

[features]
# The browser demo: no saving, exporting or opening files in another program. The functions
# that write files (and the browser's downloads) are left out of the build, not just hidden.
demo = []
