[package]
name = "drift-render"
description = "GPU canvas renderer for Drift (wgpu, WebGL2-compatible)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
drift-core.workspace = true
wgpu.workspace = true

[lints]
workspace = true

[dev-dependencies]
naga = { version = "30.0", features = ["wgsl-in", "glsl-out"] }
png = "0.18"
pollster = "1.0"
# Enable real GPU backends for the offscreen render test (apps get these via egui-wgpu).
wgpu = { workspace = true, features = ["default"] }
