# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Keeps every dependency compatible with Drift's MIT OR Apache-2.0 licence.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",          # egui's bundled default fonts
    "Ubuntu-font-1.0",  # egui's bundled default fonts
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The updater's certificate checker (rustls-platform-verifier) depends on Mozilla's root
# certificates only when built for wasm32, which the updater never is. cargo-deny merges
# the targets, so it lists them; they are not part of any Drift build.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
