# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Keeps every dependency under a permissive licence, so Drift (FSL-1.1-ALv2) can ship them.


[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
version = 2
yanked = "warn"
ignore = [
    # zbus_names, zvariant and zvariant_derive are unmaintained (merged into zbus 6). eframe
    # pulls them in on Linux through accesskit's AT-SPI support, and there is no upgrade
    # until accesskit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: via eframe/accesskit; no upgrade yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: via eframe/accesskit; no upgrade yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via eframe/accesskit; no upgrade yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",          # egui's bundled default fonts
    "Ubuntu-font-1.0",  # egui's bundled default fonts
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The updater's certificate checker (rustls-platform-verifier) depends on Mozilla's root
# certificates only when built for wasm32, which the updater never is. cargo-deny merges
# the targets, so it lists them; they are not part of any Drift build.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # DWG import (drift-io's `dwg` feature). MPL-2.0 is copyleft per file: Drift may link it
    # under any licence, but changes to acadrust's own files must be published under MPL-2.0.
    # It is ported from ACadSharp (MIT), whose notice scripts/notices.py adds.
    { allow = ["MPL-2.0"], crate = "acadrust" },
]

[licenses.private]
# Drift's own crates aren't published; their licence is Drift's (see LICENSE.md).
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
