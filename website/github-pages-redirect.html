<!doctype html>
<!--
  Served at the old GitHub Pages address (chrisplange.github.io/Drift/) once the website is
  live, so old links to the web app still work. CI fills in SITE_URL from the repository
  variable of the same name; see website/README.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drift has moved</title>
    <link rel="canonical" href="SITE_URL/app/" />
    <meta http-equiv="refresh" content="0; url=SITE_URL/app/" />
    <script>
      location.replace("SITE_URL/app/" + location.hash);
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #18191c;
        color: #e8e8ea;
        font-family: system-ui, sans-serif;
      }
      a {
        color: #0a84ff;
      }
    </style>
  </head>
  <body>
    <p>Drift in the browser has moved to <a href="SITE_URL/app/">SITE_URL/app/</a>.</p>
  </body>
</html>
